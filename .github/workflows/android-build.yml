name: Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Sky Live
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: flutter create --platforms=android --org com.skylivetv --project-name skylivetv .

      - name: Ensure widget test matches the app entrypoint
        # flutter create scaffolds test/widget_test.dart referencing MyApp;
        # our app entrypoint is SkyLiveTvApp. Overwrite it deterministically.
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:skylivetv/main.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            setUp(() {
              SharedPreferences.setMockInitialValues(<String, Object>{});
            });

            testWidgets('app launches and shows home header',
                (WidgetTester tester) async {
              await tester.pumpWidget(const SkyLiveTvApp());
              // Splash animates ~2.3s before navigating to HomeScreen.
              await tester.pump(const Duration(seconds: 3));
              await tester.pump(const Duration(milliseconds: 600));
              expect(find.text('SKY LIVE'), findsOneWidget);
            });
          }
          DART

      - name: Configure Android network access for streams
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          internet = '<uses-permission android:name="android.permission.INTERNET" />'
          if internet not in text:
              text = text.replace('<application', internet + '\n    <application', 1)
          if 'android:usesCleartextTraffic=' not in text:
              text = re.sub(r'<application(\s)', r'<application android:usesCleartextTraffic="true"\1', text, count=1)
          else:
              text = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', text, count=1)
          # App display name under the launcher icon.
          if 'android:label=' in text:
              text = re.sub(r'android:label="[^"]*"', 'android:label="Sky Live"', text, count=1)
          else:
              text = re.sub(r'<application(\s)', r'<application android:label="Sky Live"\1', text, count=1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons and native splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: skylivetv-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
